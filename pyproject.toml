[project]
name = "battle-city-reimagined"
version = "0.1.0"
description = "Deterministic, data-driven tank combat with bots and authoritative multiplayer."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-ra"
