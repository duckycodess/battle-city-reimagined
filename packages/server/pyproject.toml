[project]
name = "battle-city-server"
version = "0.1.0"
description = "Headless asyncio authoritative game server."
requires-python = ">=3.14"
dependencies = [
  "battle-city-content",
  "battle-city-protocol",
  "battle-city-sim",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
battle-city-content = { workspace = true }
battle-city-protocol = { workspace = true }
battle-city-sim = { workspace = true }
