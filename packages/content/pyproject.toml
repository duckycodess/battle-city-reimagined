[project]
name = "battle-city-content"
version = "0.1.0"
description = "Declarative level packs, schemas, and content validation."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battle_city_content"]

[tool.hatch.build]
include = ["src/battle_city_content/**/*.json", "src/battle_city_content/**/*.py"]
