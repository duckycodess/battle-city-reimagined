[project]
name = "battle-city-tools"
version = "0.1.0"
description = "Headless level-pack validation and authoring tools."
requires-python = ">=3.14"
dependencies = [
  "battle-city-content",
  "battle-city-protocol",
]

[project.scripts]
battle-city-tools = "battle_city_tools.cli:main"
battle-city-assets = "battle_city_tools.assets.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
battle-city-content = { workspace = true }
battle-city-protocol = { workspace = true }
